<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday Friend 🎉</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      height:100vh;
      overflow:hidden;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#ff758c,#ff7eb3,#7afcff);
      padding:20px;
    }

    .card{
      width:100%;
      max-width:400px;
      background:rgba(255,255,255,0.15);
      backdrop-filter:blur(10px);
      border:1px solid rgba(255,255,255,0.2);
      border-radius:25px;
      padding:30px 20px;
      text-align:center;
      color:white;
      box-shadow:0 10px 30px rgba(0,0,0,0.2);
      animation:float 3s ease-in-out infinite;
    }

    @keyframes float{
      0%,100%{
        transform:translateY(0px);
      }
      50%{
        transform:translateY(-10px);
      }
    }

    .emoji{
      font-size:70px;
      animation:bounce 1.5s infinite;
    }

    @keyframes bounce{
      0%,100%{
        transform:translateY(0);
      }
      50%{
        transform:translateY(-15px);
      }
    }

    h1{
      margin-top:15px;
      font-size:2rem;
      font-weight:700;
    }

    h2{
      margin-top:10px;
      font-size:1.3rem;
      font-weight:400;
    }

    p{
      margin-top:20px;
      line-height:1.7;
      font-size:1rem;
      color:#f3f3f3;
    }

    .btn{
      margin-top:25px;
      padding:12px 25px;
      border:none;
      border-radius:50px;
      background:white;
      color:#ff4f81;
      font-size:1rem;
      font-weight:600;
      cursor:pointer;
      transition:0.3s;
    }

    .btn:hover{
      transform:scale(1.08);
      background:#ffe6ee;
    }

    canvas{
      position:fixed;
      top:0;
      left:0;
      pointer-events:none;
    }

    @media(max-width:480px){
      h1{
        font-size:1.7rem;
      }

      h2{
        font-size:1.1rem;
      }

      p{
        font-size:0.95rem;
      }

      .emoji{
        font-size:60px;
      }
    }
  </style>
</head>

<body>

  <canvas id="confetti"></canvas>

  <div class="card">
    <div class="emoji">🎂</div>

    <h1>Happy Birthday!</h1>
    <h2>Dear Best Friend 💖</h2>

    <p>
      Wishing you endless happiness, success, and lots of amazing memories.
      Thank you for being such a wonderful friend.
      May your day be filled with love, laughter, and cake! 🎉
    </p>

    <button class="btn" onclick="launchConfetti()">
      Celebrate 🎊
    </button>
  </div>

  <!-- Confetti Script -->
  <script>
    const canvas = document.getElementById("confetti");
    const ctx = canvas.getContext("2d");

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let confetti = [];

    function createConfetti() {
      for (let i = 0; i < 150; i++) {
        confetti.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height - canvas.height,
          r: Math.random() * 6 + 2,
          d: Math.random() * 100,
          color: `hsl(${Math.random() * 360},100%,50%)`,
          tilt: Math.random() * 10 - 10,
          speed: Math.random() * 3 + 2
        });
      }
    }

    function drawConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      confetti.forEach((c) => {
        ctx.beginPath();
        ctx.lineWidth = c.r;
        ctx.strokeStyle = c.color;
        ctx.moveTo(c.x + c.tilt, c.y);
        ctx.lineTo(c.x, c.y + c.tilt + c.r);
        ctx.stroke();
      });

      updateConfetti();
    }

    function updateConfetti() {
      confetti.forEach((c) => {
        c.y += c.speed;
        c.x += Math.sin(c.d);

        if (c.y > canvas.height) {
          c.y = -20;
          c.x = Math.random() * canvas.width;
        }
      });
    }

    function animate() {
      drawConfetti();
      requestAnimationFrame(animate);
    }

    function launchConfetti() {
      confetti = [];
      createConfetti();
    }

    launchConfetti();
    animate();

    window.addEventListener("resize", () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>

</body>
</html>
